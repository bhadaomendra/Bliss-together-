<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320">
  <defs>
    <filter id="cloud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Spark Lines Top-Left -->
  <line x1="85" y1="65" x2="60" y2="40" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="115" y1="48" x2="100" y2="20" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

  <!-- Spark Lines Top-Right -->
  <line x1="435" y1="65" x2="460" y2="40" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="405" y1="48" x2="420" y2="20" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="460" y1="95" x2="485" y2="85" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

  <!-- Spark Lines Bottom-Right -->
  <line x1="445" y1="235" x2="470" y2="258" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="415" y1="255" x2="430" y2="282" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

  <!-- Spark Lines Bottom-Left -->
  <line x1="105" y1="255" x2="85" y2="278" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="135" y1="270" x2="125" y2="295" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

  <!-- Puffy Scalloped Cloud Shape -->
  <path d="M 140 80 
           A 42 42 0 0 1 210 55 
           A 52 52 0 0 1 300 50 
           A 46 46 0 0 1 380 70 
           A 44 44 0 0 1 435 115 
           A 42 42 0 0 1 445 170 
           A 44 44 0 0 1 410 220 
           A 46 46 0 0 1 340 250 
           A 52 52 0 0 1 240 255 
           A 46 46 0 0 1 160 238 
           A 42 42 0 0 1 105 198 
           A 44 44 0 0 1 95 135 
           A 42 42 0 0 1 140 80 Z" 
        fill="#FFFFFF" filter="url(#cloud-shadow)" />

  <!-- Thought Dots -->
  <circle cx="82" cy="225" r="18" fill="#FFFFFF" filter="url(#cloud-shadow)" />
  <circle cx="52" cy="258" r="10" fill="#FFFFFF" filter="url(#cloud-shadow)" />
</svg>